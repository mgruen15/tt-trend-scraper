name: Scrape TikTok trends

on:
  schedule:
    # 4x täglich (UTC): 05:17, 11:17, 17:17, 23:17 – bewusst nicht zur vollen Stunde,
    # da GitHub geplante Runs zur vollen Stunde oft verzögert.
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Optional: Ländercodes, leerzeichengetrennt (leer = alle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Restore the previous output (history.json) from the data branch, if it exists.
      - name: Restore previous data
        run: |
          mkdir -p site
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git --work-tree=site checkout FETCH_HEAD -- .
            echo "Restored previous data from $DATA_BRANCH."
          else
            echo "No $DATA_BRANCH branch yet – starting fresh."
          fi
          git reset -q

      - name: Run scraper
        env:
          COUNTRIES: ${{ github.event.inputs.countries }}
        run: |
          if [ -n "$COUNTRIES" ]; then
            python -m tt_trends.scrape --out site --countries $COUNTRIES
          else
            python -m tt_trends.scrape --out site
          fi

      # The data branch always holds exactly one commit with the latest dashboard,
      # so the repository does not grow with every run.
      - name: Publish to data branch
        working-directory: site
        run: |
          git init -q -b "$DATA_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Trends $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:$DATA_BRANCH"
